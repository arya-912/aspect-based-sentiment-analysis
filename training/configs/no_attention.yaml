# Ablation run: identical to default.yaml except that the aspect attention is
# removed, written to artifacts/absa-noattn.
#
# `model.use_attention: false` drops the AspectAttention module entirely and
# mean-pools the same context tokens instead, i.e. forces alpha_i = 1/|context|.
# The head still receives [c ; a ; h_CLS] at the same width, so the only thing
# taken away is the *learned* weighting -- which is the claim the architecture
# rests on, and the claim this run tests.
#
# Every other value below is a verbatim copy of default.yaml, the seed included.
# That is the whole validity of the comparison: change anything else here and
# the difference in scores no longer isolates the attention. Keep the two files
# in step.
#
# Paths are relative to the repository root, so these work from anywhere.
seed: 42

model:
  name: bert-base-uncased
  max_length: 128
  dropout: 0.1
  num_labels: 3
  use_attention: false

training:
  epochs: 4
  batch_size: 16
  lr: 3e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  val_fraction: 0.1
  # Stop after this many consecutive epochs with no new best val macro F1.
  # 0 or null runs every configured epoch. This changes neither recorded run:
  # absa-v1 peaked at epoch 3 of 4 and absa-noattn at epoch 2, so the counter
  # never reaches 2 before the configured epochs run out. It is insurance for
  # raising `epochs`, not a change to the published results.
  early_stopping_patience: 2
  # best.pt is the trainer's crash net during a run. Once the artifact's
  # model.pt holds the same weights it is a 449MB duplicate that nothing
  # reads, so it is deleted when the run completes. true keeps it.
  keep_checkpoint: false

paths:
  raw_train: training/data/raw/Laptop_Train_v2.csv
  official_test: training/data/raw/Laptops_Test_Gold.csv
  processed_dir: training/data/processed/splits
  artifacts_dir: training/artifacts

artifact:
  version: absa-noattn

# Label order defines the class ids: negative=0, neutral=1, positive=2.
data:
  labels: [negative, neutral, positive]
  class_weighting: true

# Head gets a higher LR than the pretrained encoder; null -> use training.lr.
optim:
  head_lr: 1.0e-4
  eval_batch_size: 64
  num_workers: 0
