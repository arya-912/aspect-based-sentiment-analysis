# Both SemEval-2014 domains in one model.
#
# Why: one artifact serves both domains, so one backend and one UI cover
# laptops and restaurants without a model picker. The cross-domain numbers say
# this should hold up -- absa-v1 scores 0.7110 macro F1 on restaurant test data
# against the restaurant-trained 0.7595, and absa-rest-v1 scores 0.7215 on
# laptops against 0.7474 -- so the two domains are not fighting each other.
#
# What this costs: the benchmark is scored per domain, so this model's headline
# macro F1 is NOT comparable to published SemEval numbers, to absa-v1, or to
# the absa-noattn ablation. Keep those as the benchmark rows and report this
# one separately, evaluated on each test set individually:
#
#   python train.py evaluate --artifact artifacts/absa-joint-v1 \
#     --test-csv data/raw/Laptops_Test_Gold.csv --out-dir /tmp/joint-on-laptops
#   python train.py evaluate --artifact artifacts/absa-joint-v1 \
#     --test-csv data/raw/Restaurants_Test_Gold.csv --out-dir /tmp/joint-on-rest
#
# Build the pooled CSVs first (they go through load_raw_csv, so they are
# already clean -- loading them reports zero conflict rows because those were
# dropped on the way in):
#
#   python merge_corpora.py data/raw/Laptop_Train_v2.csv data/raw/Restaurants_Train_v2.csv \
#     --out data/raw/Joint_Train.csv
#   python merge_corpora.py data/raw/Laptops_Test_Gold.csv data/raw/Restaurants_Test_Gold.csv \
#     --out data/raw/Joint_Test_Gold.csv
#
#   train: 5915 rows, 3432 sentences (1671 neg / 1093 neu / 3151 pos)
#   test:  1758 rows, 1011 sentences ( 324 neg /  365 neu / 1069 pos)
#
# 2.6x the laptop corpus, so ~24 min/epoch on this CPU: budget ~1.7h.
seed: 42

model:
  name: bert-base-uncased
  max_length: 128
  dropout: 0.1
  num_labels: 3

training:
  epochs: 4
  batch_size: 16
  lr: 3e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  val_fraction: 0.1
  early_stopping_patience: 2
  keep_checkpoint: false

paths:
  raw_train: training/data/raw/Joint_Train.csv
  official_test: training/data/raw/Joint_Test_Gold.csv
  processed_dir: training/data/processed/splits-joint
  artifacts_dir: training/artifacts

artifact:
  version: absa-joint-v1

data:
  labels: [negative, neutral, positive]
  class_weighting: true

optim:
  head_lr: 1.0e-4
  eval_batch_size: 64
  num_workers: 0
