# Tests on every push and pull request. Three jobs rather than one, so a
# frontend typo cannot hide a backend failure in the same log.
#
# Nothing here downloads a model or the corpus: the 179 training tests build a
# tiny randomly-initialised BERT (2 layers, hidden 32) from a config, the 86
# backend tests inject fakes into the registry, and the tests that need the
# SemEval CSVs skip cleanly when they are absent -- which they always are here,
# since training/data/ is gitignored.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run: the only result that
# matters is the one for the current head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training:
    name: training tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: training/requirements.txt
      - name: Install (CPU torch)
        # The default index serves the CUDA build: ~2.5GB of wheels for nvidia
        # libraries that never load on a CI runner. The CPU index is the same
        # torch, a tenth of the download.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r training/requirements.txt
          pip install pytest
      - run: python -m pytest tests/ -q
        working-directory: training

  backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install (CPU torch)
        # The backend imports the training package for the model class, so it
        # needs torch and transformers even though these tests never load a
        # real artifact.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r backend/requirements.txt -r training/requirements.txt
          pip install pytest httpx
      - run: python -m pytest tests/ -q
        working-directory: backend

  frontend:
    name: frontend build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # build is the type check: package.json runs `tsc -b && vite build`.
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
