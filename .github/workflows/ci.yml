# Tests on every push and pull request. Three jobs rather than one, so a
# frontend typo cannot hide a backend failure in the same log.
#
# The 179 training tests build a tiny randomly-initialised BERT (2 layers,
# hidden 32) from a config and the 88 backend tests inject fakes into the
# registry, so no job loads a real artifact.
#
# Two things are *not* available here and are handled explicitly rather than
# skipped silently:
#
#   * The SemEval CSVs are gitignored, so five dataset tests always skip.
#     ABSA_MAX_SKIPS pins that number -- a sixth test starting to skip for
#     any other reason fails the run instead of hiding behind "5 skipped".
#   * The bert-base-uncased tokenizer is fetched (and cached) in a named
#     step. It used to be fetched lazily inside a fixture that skipped on
#     failure, so a hub outage or a renamed checkpoint turned 23 real tests
#     into a green check. The fetch now fails the job, and
#     ABSA_REQUIRE_FIXTURES=1 makes the fixture fail rather than skip if it
#     somehow still cannot load.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run: the only result that
# matters is the one for the current head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training:
    name: training tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: training/requirements.txt
      - name: Install (CPU torch)
        # The default index serves the CUDA build: ~2.5GB of wheels for nvidia
        # libraries that never load on a CI runner. The CPU index is the same
        # torch, a tenth of the download.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r training/requirements.txt
          pip install pytest
      # Cached across runs: the tokenizer is a few hundred KB of vocab and
      # config, and keeping it local means the suite is not at the mercy of
      # the hub on every push.
      - name: Cache the bert-base-uncased tokenizer
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tokenizer-bert-base-uncased-v1
      - name: Fetch the tokenizer
        # A named step, so a hub failure is reported as a hub failure here
        # rather than as 23 skipped tests further down.
        run: python -c "from transformers import AutoTokenizer; AutoTokenizer.from_pretrained('bert-base-uncased')"
      - run: python -m pytest tests/ -q -rs
        working-directory: training
        env:
          ABSA_REQUIRE_FIXTURES: '1'
          # The five dataset tests that need the gitignored SemEval CSVs.
          ABSA_MAX_SKIPS: '5'

  backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install (CPU torch)
        # The backend imports the training package for the model class, so it
        # needs torch and transformers even though these tests never load a
        # real artifact.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r backend/requirements.txt -r training/requirements.txt
          pip install pytest httpx
      - run: python -m pytest tests/ -q -rs
        working-directory: backend
        env:
          # These tests need no corpus, no artifact and no download, so a
          # skip here is always someone silencing a test.
          ABSA_MAX_SKIPS: '0'

  frontend:
    name: frontend build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # build is the type check: package.json runs `tsc -b && vite build`,
      # and tsconfig.json references tsconfig.test.json, so the test files
      # are typechecked here too.
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      # Reads backend/tests/fixtures/stem_parity.json, so it needs the whole
      # repo checked out -- which it is. That file is the contract between
      # the backend's 422 gate and the UI's copy of the same rule; this job
      # and the backend job check the two halves of it.
      - run: npm test
        working-directory: frontend
